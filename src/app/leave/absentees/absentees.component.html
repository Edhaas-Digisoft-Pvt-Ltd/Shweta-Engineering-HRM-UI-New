<div class="right-panel">
    <div class="loader-overlay" *ngIf="isLoading">
        <app-loader></app-loader>
    </div>
    <div class="main-content" [class.loading]="isLoading">

        <div class="row gx-3  align-items-center rounded-2">
            <div class="col-12">
                <div class="row justify-content-end">
                    <div class="col-3">
                        <label for="">Select Company</label>
                        <select class="form-select" [(ngModel)]="selectedCompanyId" (change)="onCompanyChange($event)">
                            <option *ngFor="let item of CompanyNames" [value]="item.company_id">{{ item.company_name }}
                            </option>
                        </select>
                    </div>

                    <div class="col-2 dotted-line">
                        <label for="">Select Year</label>
                        <select class="form-select" [(ngModel)]="selectedYear" (change)="onYearMonthChange()">
                            <option *ngFor="let year of financialYears">{{ year }}</option>
                        </select>
                    </div>

                    <div class="col-2">
                        <label for="">Select Month</label>
                        <select class="form-select" [(ngModel)]="selectedMonth" (change)="onYearMonthChange()">
                            <option *ngFor="let month of months" [value]="month.id">{{ month.value }}</option>
                        </select>
                    </div>

                    <div class="col-auto d-flex align-items-end">
                        <button class="btn btn-primary BtnColor me-2" (click)="exportExcel()">
                            <i class="bi bi-file-earmark-text-fill"></i>
                        </button>
                    </div>

                </div>
            </div>
        </div>

        <div class="row gap-4 row-wrap my-3 ">
            <div class="container  ">

                <div class="row g-3">
                    <div class="col-12">
                        <!-- style="width: 100%; height: 60vh;" -->
                        <ag-grid-angular class="ag-theme-alpine" [rowData]="rowData" [gridOptions]="gridOptions"
                            [domLayout]="'autoHeight'" [pagination]="false" [columnDefs]="columnDefs"
                            [defaultColDef]="defaultColDef" (gridReady)="onGridReady($event)">
                        </ag-grid-angular>

                        <div class="d-flex align-items-center justify-content-end flex-wrap mt-3 gap-2">
                            <button class="btn btn-sm btn-primary rounded" (click)="prevPage()"
                                [disabled]="currentPage === 1">Prev</button>
                            <button class="btn btn-sm btn-primary rounded" (click)="nextPage()"
                                [disabled]="currentPage === lastPage">Next</button>

                            <ng-container *ngFor="let page of pagesToShow">
                                <span *ngIf="page !== '...'; else ellipsis" (click)="goToPage(page)"
                                    [class.current]="page === currentPage" class="page-text">
                                    <ng-container *ngIf="page === currentPage">[{{ page
                                        }}]</ng-container>
                                    <ng-container *ngIf="page !== currentPage">{{ page
                                        }}</ng-container>
                                </span>
                                <ng-template #ellipsis><span class="mx-1">...</span></ng-template>
                            </ng-container>
                        </div>
                    </div>
                </div>
            </div>

        </div>

    </div>
</div>
