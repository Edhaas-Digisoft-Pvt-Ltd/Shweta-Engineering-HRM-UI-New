<div class="right-panel">
  <div class="loader-overlay" *ngIf="isLoading">
    <app-loader></app-loader>
  </div>
  <div class="main-content" [class.loading]="isLoading">

    <div class="row gx-3 align-items-center rounded-2">
      <div class="col-12">
        <div class="row justify-content-end">
          <div class="col-3">
            <label>Select Company</label>
            <div class="custom-select-dropdown w-100">
              <button type="button" class="btn btn-outline-secondary dropdown-toggle-btn"
                (click)="toggleCompanyDropdown()">
                <span class="text-truncate">{{ companyDropdownLabel }}</span>
                <i class="bi bi-chevron-down ms-2"></i>
              </button>

              <div class="dropdown-menu" [class.show]="companyDropdownOpen">
                <div class="form-check dropdown-divider-item">
                  <input class="form-check-input" type="checkbox" id="company-all-upcoming" [checked]="isAllSelected()"
                    (change)="toggleAll($event)">
                  <label class="form-check-label" for="company-all-upcoming">All</label>
                </div>

                <div class="form-check" *ngFor="let item of CompanyNames">
                  <input class="form-check-input" type="checkbox" [id]="'company-upcoming-' + item.company_id"
                    [checked]="isCompanySelected(item.company_id)" (change)="toggleCompany(item.company_id, $event)">
                  <label class="form-check-label" [for]="'company-upcoming-' + item.company_id">{{ item.company_name
                    }}</label>
                </div>
              </div>
            </div>
          </div>

          <div class="col-auto d-flex align-items-end">
            <button class="btn btn-primary BtnColor me-2" (click)="exportExcel()">
              <i class="bi bi-file-earmark-text-fill"></i>
            </button>
          </div>

        </div>
      </div>
    </div>

     <p class="fst-italic text-muted text-end mt-1">
      Showing approved leaves between {{ dateRangeLabel }}
    </p>

    <div class="row row-wrap">
      <div class="container-fluid px-0 py-0">
        <div class="row g-3">
          <div class="col-12">
            <ag-grid-angular class="ag-theme-alpine" [rowData]="rowData" [gridOptions]="gridOptions"
              [domLayout]="'autoHeight'" [pagination]="false" [columnDefs]="columnDefs" [defaultColDef]="defaultColDef"
              (gridReady)="onGridReady($event)">
            </ag-grid-angular>

            <div class="d-flex align-items-center justify-content-end flex-wrap mt-3 gap-2">
              <button class="btn btn-sm btn-primary rounded" (click)="prevPage()"
                [disabled]="currentPage === 1">Prev</button>
              <button class="btn btn-sm btn-primary rounded" (click)="nextPage()"
                [disabled]="currentPage === lastPage">Next</button>

              <ng-container *ngFor="let page of pagesToShow">
                <span *ngIf="page !== '...'; else ellipsis" (click)="goToPage(page)"
                  [class.current]="page === currentPage" class="page-text">
                  <ng-container *ngIf="page === currentPage">[{{ page }}]</ng-container>
                  <ng-container *ngIf="page !== currentPage">{{ page }}</ng-container>
                </span>
                <ng-template #ellipsis><span class="mx-1">...</span></ng-template>
              </ng-container>
            </div>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>
