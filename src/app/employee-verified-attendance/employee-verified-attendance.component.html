<div class="right-panel">
  <div class="loader-overlay" *ngIf="isLoading">
    <app-loader></app-loader>
  </div>

  <div class="main-content" [class.loading]="isLoading">
    <div class="container-fluid mt-4">

      <h2 class="fw-bold mb-3">
        <i class="bi bi-alarm me-2"></i>My Attendance
      </h2>

      <div class="d-flex flex-wrap justify-content-end align-items-end gap-2 mb-3">
        <div>
          <label class="form-label mb-1" style="font-size: 12px;">From Date</label>
          <input class="form-control form-control-sm" type="date"
                 [(ngModel)]="startDate" (change)="onDateRangeChange()" />
        </div>
        <div>
          <label class="form-label mb-1" style="font-size: 12px;">To Date</label>
          <input class="form-control form-control-sm" type="date"
                 [(ngModel)]="endDate" (change)="onDateRangeChange()" />
        </div>
      </div>

      <div class="row gap-4 row-wrap my-3 ">
        <div class="container  ">
          <div class="row g-3">
            <div class="col-12">
              <ag-grid-angular class="ag-theme-alpine" style="width: 100%; height: 60vh;"
                  [rowData]="rowData" [columnDefs]="columnDefs" [pagination]="true" [paginationPageSize]="10"
                  [defaultColDef]="defaultColDef" (gridReady)="onGridReady($event)">
              </ag-grid-angular>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>
