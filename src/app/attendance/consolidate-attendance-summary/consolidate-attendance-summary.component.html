<div class="right-panel">
  <div class="loader-overlay" *ngIf="isLoading">
    <app-loader></app-loader>
  </div>
  <div class="main-content" [class.loading]="isLoading">

    <div class="row mb-3">
      <div class="col d-flex justify-content-end align-items-end gap-3 flex-wrap">

        <!-- Search -->
        <div class="d-flex flex-column">
          <label class="form-label mb-1">Search</label>
          <input type="text" class="form-control" placeholder="Search here" [(ngModel)]="searchValue"
            (ngModelChange)="onFilterBoxChange()" />
        </div>

        <!-- From Date -->
        <div class="d-flex flex-column">
          <label class="form-label mb-1">From Date</label>
          <input type="date" [(ngModel)]="fromDate" class="form-control" (change)="onDateRangeChange()" />
        </div>

        <!-- To Date -->
        <div class="d-flex flex-column">
          <label class="form-label mb-1">To Date</label>
          <input type="date" [(ngModel)]="toDate" class="form-control" (change)="onDateRangeChange()" />
        </div>

        <!-- Export Button -->
        <div class="d-flex flex-column justify-content-end">
          <button class="btn btn-primary exportExcelBtn" (click)="exportToExcel()">
            <i class="bi bi-file-earmark-text-fill"></i>
          </button>
        </div>

      </div>
    </div>


    <div class="row gap-4 row-wrap">
      <div class="container  ">

        <div class="row g-3">
          <div class="col-12">

            <!-- Day View Grid -->
            <!-- <ag-grid-angular *ngIf="viewMode === 'Day'" class="ag-theme-alpine" [rowData]="rowData"
            [columnDefs]="columnDefs" (gridReady)="onGridReady($event)" rowSelection="multiple"
            style="width: 100%; height: 400px;">
          </ag-grid-angular> -->
            <!--  -->

            <!-- Month View Grid -->
            <!-- style="width: 100%; height: 600px;" -->
            <ag-grid-angular class="ag-theme-alpine" id="specualGrid2" [gridOptions]="gridOptions" [pagination]="false"
              [columnDefs]="columnDefs" [defaultColDef]="defaultColDef" [rowData]="rowData" [domLayout]="'autoHeight'"
              (gridReady)="onGridReady($event)">
            </ag-grid-angular>

            <div class="d-flex align-items-center justify-content-end flex-wrap mt-3 gap-2">
              <button class="btn btn-sm btn-primary rounded" (click)="prevPage()"
                [disabled]="currentPage === 1">Prev</button>
              <button class="btn btn-sm btn-primary rounded" (click)="nextPage()"
                [disabled]="currentPage === lastPage">Next</button>

              <ng-container *ngFor="let page of pagesToShow">
                <span *ngIf="page !== '...'; else ellipsis" (click)="goToPage(page)"
                  [class.current]="page === currentPage" class="page-text">
                  <ng-container *ngIf="page === currentPage">[{{ page
                    }}]</ng-container>
                  <ng-container *ngIf="page !== currentPage">{{ page
                    }}</ng-container>
                </span>
                <ng-template #ellipsis><span class="mx-1">...</span></ng-template>
              </ng-container>
            </div>
          </div>
        </div>
      </div>

      <div class="list mt-2">
        <ul>
          <li><span class="dot"></span> P - Present</li>
          <li><span class="dot"></span> A - Absent</li>
          <li><span class="dot"></span> W - Weekend</li>
          <li><span class="dot"></span> W/od - Weekend</li>
          <li><span class="dot"></span> H - Holiday</li>
          <li><span class="dot"></span> WFH - Work From Home</li>
          <li><span class="dot"></span> HD - Half Day</li>
          <li><span class="dot"></span> LT - Late</li>
        </ul>

      </div>

    </div>

  </div>
</div>
