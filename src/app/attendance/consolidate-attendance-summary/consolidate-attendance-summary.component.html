<div class="right-panel">
  <div class="loader-overlay" *ngIf="isLoading">
    <app-loader></app-loader>
  </div>
  <div class="main-content" [class.loading]="isLoading">

    <div class="row mb-3">
      <div class="col d-flex justify-content-end align-items-end gap-3 flex-wrap">

        <!-- Search -->
        <div class="d-flex flex-column">
          <label class="form-label mb-1">Search</label>
          <input class="form-control" type="text" placeholder="Search here" [(ngModel)]="searchValue"
            (ngModelChange)="onFilterBoxChange()" />
        </div>

        <!-- From Date -->
        <div class="d-flex flex-column">
          <label class="form-label mb-1">From Date</label>
          <input type="date" [(ngModel)]="fromDate" class="form-control" (change)="onDateRangeChange()" />
        </div>

        <!-- To Date -->
        <div class="d-flex flex-column">
          <label class="form-label mb-1">To Date</label>
          <input type="date" [(ngModel)]="toDate" class="form-control" (change)="onDateRangeChange()" />
        </div>

        <!-- Export Button -->
        <div class="d-flex flex-column justify-content-end">
          <button class="btn btn-primary exportExcelBtn">
            <i class="bi bi-file-earmark-text-fill"></i>
          </button>
        </div>

      </div>
    </div>


    <div class="row gap-4 row-wrap">
      <div class="container  ">

        <div class="row g-3">
          <div class="col-12">

            <!-- Day View Grid -->
            <!-- <ag-grid-angular *ngIf="viewMode === 'Day'" class="ag-theme-alpine" [rowData]="rowData"
            [columnDefs]="columnDefs" (gridReady)="onGridReady($event)" rowSelection="multiple"
            style="width: 100%; height: 400px;">
          </ag-grid-angular> -->
            <!--  -->

            <!-- Month View Grid -->
            <ag-grid-angular style="width: 100%; height: 600px;" class="ag-theme-alpine" id="specualGrid2"
              [gridOptions]="gridOptions" [pagination]="true" [columnDefs]="columnDefs" [defaultColDef]="defaultColDef"
              [rowData]="rowData" [domLayout]="'autoHeight'" (gridReady)="onGridReady($event)">
            </ag-grid-angular>
          </div>
        </div>
      </div>

      <div class="list mt-2">
        <ul>
          <li><span class="dot"></span> P - Present</li>
          <li><span class="dot"></span> A - Absent</li>
          <li><span class="dot"></span> W - Weekend</li>
          <li><span class="dot"></span> W/od - Weekend</li>
          <li><span class="dot"></span> H - Holiday</li>
          <li><span class="dot"></span> WFH/2 - Work From Home Half Day</li>
          <li><span class="dot"></span> HD - Half Day</li>
          <li><span class="dot"></span> LT - Late</li>
        </ul>

      </div>

    </div>

  </div>
</div>
