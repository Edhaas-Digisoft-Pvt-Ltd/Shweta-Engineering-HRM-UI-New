<div class="position-relative">

  <div class="loader-overlay" *ngIf="isLoading">
    <app-loader></app-loader>
  </div>

  <div [class.loading]="isLoading">
    <div class="container-fluid">

      <!-- Toolbar -->
      <div class="d-flex flex-wrap justify-content-end align-items-center gap-3 mt-3 mb-3">

        <!-- Search -->
        <input class="form-control form-control-sm" type="text" placeholder="Search" [(ngModel)]="searchInputValue"
          (ngModelChange)="onSearchChange()" style="min-width:180px; max-width:220px;" />

        <!-- Year -->
        <div class="d-flex align-items-center gap-1">
          <label class="fw-semibold mb-0 text-nowrap">Year</label>
          <select class="form-select form-select-sm" style="width:90px;" [(ngModel)]="selectedYear"
            (ngModelChange)="onFilterChange()">
            <option *ngFor="let y of years" [value]="y">{{ y }}</option>
          </select>
        </div>

        <!-- Month -->
        <div class="d-flex align-items-center gap-1">
          <label class="fw-semibold mb-0 text-nowrap">Month</label>
          <select class="form-select form-select-sm" style="width:110px;" [(ngModel)]="selectedMonth"
            (ngModelChange)="onFilterChange()">
            <option *ngFor="let m of months" [value]="m.value">{{ m.label }}</option>
          </select>
        </div>

        <!-- Verify Selected Button -->
        <button class="btn btn-success btn-sm rounded-3" (click)="verifySelected()" [disabled]="isLoading">
          <i class="bi bi-check2-square"></i>&nbsp;Verify
          <span *ngIf="selectedCount > 0" class="badge bg-dark ms-1">{{ selectedCount }}</span>
        </button>

      </div>

      <!-- AG Grid -->
      <div class="row">
        <div class="col-12">
          <ag-grid-angular class="ag-theme-alpine" style="width:100%; height:60vh;" [rowData]="rowData"
            [columnDefs]="columnDefs" [defaultColDef]="defaultColDef" [gridOptions]="gridOptions"
            (gridReady)="onGridReady($event)">
          </ag-grid-angular>
        </div>
      </div>

    </div>
  </div>
</div>


<!-- ═══════════════════════════════════════════════════════════════════════════
     EDIT ATTENDANCE MODAL
     Matches the "Approved Salary Request Info" modal style in the app
     ═══════════════════════════════════════════════════════════════════════════ -->
<div class="modal-backdrop-custom" *ngIf="showEditModal" (click)="closeEditModal()"></div>

<!-- EDIT ATTENDANCE MODAL -->
<div class="modal fade" id="editAttendanceModal" tabindex="-1" aria-labelledby="editAttModalTitle"
  [class.show]="showEditModal" [style.display]="showEditModal ? 'block' : 'none'"
  [style.background]="showEditModal ? 'rgba(0,0,0,0.45)' : ''">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content">

      <!-- Header -->
      <div class="modal-header">
        <h1 class="modal-title fs-5" id="editAttModalTitle">Edit Attendance Info</h1>
        <button type="button" class="btn-close btn-close-white" (click)="closeEditModal()" aria-label="Close"></button>
      </div>

      <!-- Body -->
      <div class="modal-body" style="padding: 10px 40px;">

        <!-- Row 1: read-only info fields -->
        <div class="row my-3">
          <div class="col-md-3">
            <label>Employee Code</label>
            <input type="text" class="form-control" [value]="editRecord.employee_code" disabled />
          </div>
          <div class="col-md-3">
            <label>Employee Name</label>
            <input type="text" class="form-control" [value]="editRecord.emp_name" disabled />
          </div>
          <div class="col-md-3">
            <label>Date</label>
            <input type="text" class="form-control" [value]="editRecord.currentdate" disabled />
          </div>
          <div class="col-md-3">
            <label>Shift</label>
            <input type="text" class="form-control" [value]="editRecord.shiftLabel" disabled />
          </div>
        </div>

        <!-- Row 2: editable time fields -->
        <div class="row my-3">
          <!-- Login Time -->
          <div class="col-md-6">
            <label>Login Time <span class="text-danger">*</span></label>
            <input type="text" class="form-control" [class.is-invalid]="loginTimeError"
              [(ngModel)]="editRecord.logged_in_time" placeholder="HH:MM:SS AM/PM" />
            <div class="invalid-feedback">
              Required. Enter time as HH:MM AM/PM
            </div>
          </div>

          <!-- Logout Time -->
          <div class="col-md-6">
            <label>Logout Time <span class="text-danger">*</span></label>
            <input type="text" class="form-control" [class.is-invalid]="logoutTimeError"
              [(ngModel)]="editRecord.logged_out_time" placeholder="HH:MM:SS AM/PM" />
            <div class="invalid-feedback">
              Required. Enter time as HH:MM AM/PM
            </div>
          </div>
        </div>

      </div>

      <!-- Footer -->
      <div class="modal-footer">
        <button type="button" class="btn approveBtn" (click)="saveEditRecord()" [disabled]="isSaving">
          <span *ngIf="isSaving" class="spinner-border spinner-border-sm me-1" role="status"></span>
          {{ isSaving ? 'Saving…' : 'Save Changes' }}
        </button>
        <button type="button" class="btn declineBtn" (click)="closeEditModal()" [disabled]="isSaving">
          Cancel
        </button>
      </div>

    </div>
  </div>
</div>
