<div class="position-relative">

  <div class="loader-overlay" *ngIf="isLoading">
    <app-loader></app-loader>
  </div>

  <div [class.loading]="isLoading">
    <div class="container-fluid">

      <!-- Toolbar -->
      <div class="d-flex flex-wrap justify-content-end align-items-center gap-3 mt-3 mb-3">

        <!-- Search -->
        <input
          class="form-control form-control-sm"
          type="text"
          placeholder="Search"
          [(ngModel)]="searchInputValue"
          (ngModelChange)="onSearchChange()"
          style="min-width:180px; max-width:220px;" />

        <!-- Year -->
        <div class="d-flex align-items-center gap-1">
          <label class="fw-semibold mb-0 text-nowrap">Year</label>
          <select class="form-select form-select-sm" style="width:90px;"
            [(ngModel)]="selectedYear" (ngModelChange)="onFilterChange()">
            <option *ngFor="let y of years" [value]="y">{{ y }}</option>
          </select>
        </div>

        <!-- Month -->
        <div class="d-flex align-items-center gap-1">
          <label class="fw-semibold mb-0 text-nowrap">Month</label>
          <select class="form-select form-select-sm" style="width:110px;"
            [(ngModel)]="selectedMonth" (ngModelChange)="onFilterChange()">
            <option *ngFor="let m of months" [value]="m.value">{{ m.label }}</option>
          </select>
        </div>

        <!-- Verify Selected Button -->
        <button
          class="btn btn-success btn-sm rounded-3"
          (click)="verifySelected()"
          [disabled]="isLoading">
          <i class="bi bi-check2-square"></i>&nbsp;Verify
          <span *ngIf="selectedCount > 0" class="badge bg-dark ms-1">{{ selectedCount }}</span>
        </button>

        <!-- Verify All Button -->
        <!-- <button
          class="btn btn-success btn-sm rounded-3"
          (click)="verifyAll()"
          [disabled]="rowData.length === 0 || isLoading">
          <i class="bi bi-check2-circle"></i>&nbsp;Verify All
        </button> -->

      </div>

      <!-- AG Grid -->
      <div class="row">
        <div class="col-12">
          <ag-grid-angular
            class="ag-theme-alpine"
            style="width:100%; height:60vh;"
            [rowData]="rowData"
            [columnDefs]="columnDefs"
            [defaultColDef]="defaultColDef"
            [gridOptions]="gridOptions"
            (gridReady)="onGridReady($event)">
          </ag-grid-angular>
        </div>
      </div>

    </div>
  </div>
</div>
