<div class="position-relative">

  <div class="loader-overlay" *ngIf="isLoading">
    <app-loader></app-loader>
  </div>

  <div [class.loading]="isLoading">
    <div class="container-fluid">

      <!-- Toolbar: matches screenshot layout -->
      <div class="d-flex flex-wrap justify-content-end align-items-center gap-3 mt-3 mb-3">

        <!-- Search -->
        <input
          class="form-control form-control-sm"
          type="text"
          placeholder="Search"
          [(ngModel)]="searchInputValue"
          (ngModelChange)="onSearchChange()"
          style="min-width:180px; max-width:220px;" />

        <!-- Year -->
        <div class="d-flex align-items-center gap-1">
          <label class="fw-semibold mb-0 text-nowrap">Year</label>
          <select class="form-select form-select-sm" style="width:90px;"
            [(ngModel)]="selectedYear" (ngModelChange)="onFilterChange()">
            <option *ngFor="let y of years" [value]="y">{{ y }}</option>
          </select>
        </div>

        <!-- Month -->
        <div class="d-flex align-items-center gap-1">
          <label class="fw-semibold mb-0 text-nowrap">Month</label>
          <select class="form-select form-select-sm" style="width:110px;"
            [(ngModel)]="selectedMonth" (ngModelChange)="onFilterChange()">
            <option *ngFor="let m of months" [value]="m.value">{{ m.label }}</option>
          </select>
        </div>

        <!-- Verify Button -->
        <button
          class="btn btn-success btn-sm rounded-3"
          (click)="verifyAll()"
          [disabled]="rowData.length === 0 || isLoading">
          <i class="bi bi-check2-circle"></i>&nbsp;Verify
        </button>

      </div>

      <!-- AG Grid -->
      <div class="row">
        <div class="col-12">

          <ag-grid-angular
            class="ag-theme-alpine"
            style="width:100%; height:55vh;"
            [rowData]="rowData"
            [columnDefs]="columnDefs"
            [defaultColDef]="defaultColDef"
            [gridOptions]="gridOptions"
            [pagination]="false">
          </ag-grid-angular>

          <!-- Pagination -->
          <div
            class="d-flex align-items-center justify-content-end flex-wrap mt-3 gap-2"
            *ngIf="lastPage > 1">

            <button class="btn btn-sm btn-primary rounded"
              (click)="prevPage()" [disabled]="currentPage === 1">Prev</button>

            <button class="btn btn-sm btn-primary rounded"
              (click)="nextPage()" [disabled]="currentPage === lastPage">Next</button>

            <ng-container *ngFor="let page of pagesToShow">
              <span
                *ngIf="page !== '...'; else ellipsis"
                (click)="goToPage(page)"
                [class.fw-bold]="page === currentPage"
                style="cursor:pointer; padding: 0 4px;">
                <ng-container *ngIf="page === currentPage">[{{ page }}]</ng-container>
                <ng-container *ngIf="page !== currentPage">{{ page }}</ng-container>
              </span>
              <ng-template #ellipsis><span class="mx-1">...</span></ng-template>
            </ng-container>

          </div>

        </div>
      </div>

    </div>
  </div>
</div>
