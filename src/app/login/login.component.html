<body>
    <!-- style="background-image: url('../../assets/img/login_bg.jpg'); background-size: cover; background-position: center;" -->
    <div class="container d-flex justify-content-center align-items-center vh-100">
        <div class="login-container shadow-lg">
            <div class="row g-0 h-100">
                <!-- Signup Section -->
                <div class="col-md-6 d-lg-flex h-full align-items-center justify-content-center text-dark">
                    <!-- <div class="text-center p-5">
                    <h2>Shweta Engineers </h2>
                    <h3> Payroll Model</h3>

                </div> -->

                    <div class="loginImage">
                        <img src="assets/img/loginpage.png" style="height: 100%;width: 100%;object-fit: fill;" alt="">
                    </div>

                    <!-- <div class="loginImage ms-5 mt-5">
                    <div *ngFor="let account of demoAccounts">
                        <input type="checkbox" [checked]="selectedRole === account.role" (change)="selectCredentials(account.role)" style="width: 20px; height: 20px; cursor: pointer;" />
                        <strong>{{ account.role }}:</strong> {{ account.email }}<br />
                        <span>pass: {{ account.password }}</span><br /><br />
                    </div>
                </div> -->
                </div>

                <!-- Login Section -->
                <div class="col-md-6 d-flex align-items-center justify-content-center login-box p-4">
                    <div class="text-center w-100">
                        <h2 class="mb-4 fw-bold">Login </h2>

                        <!-- Login Type Toggle -->
                        <div class="login-type-toggle mt-4 d-flex justify-content-center gap-4">
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="loginType" id="officeUse"
                                    value="office" [(ngModel)]="loginType" (change)="onLoginTypeChange()">
                                <label class="form-check-label fw-semibold" for="officeUse">
                                    <i class="bi bi-building"></i> Office Use
                                </label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="loginType" id="employeeUse"
                                    value="employee" [(ngModel)]="loginType" (change)="onLoginTypeChange()">
                                <label class="form-check-label fw-semibold" for="employeeUse">
                                    <i class="bi bi-person"></i> Employee
                                </label>
                            </div>
                        </div>

                        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
                            <!-- Email Field -->
                            <div class="mt-4 input-group">
                                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                <input type="email" class="form-control" formControlName="email"
                                    placeholder="Enter Contact Number">
                            </div>
                            <small class="text-danger"
                                *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
                                * This Field is Required
                            </small>

                            <!-- Password Field -->
                            <div class="mt-4 input-group">
                                <span class="input-group-text">
                                    <i class="bi bi-key-fill"></i>
                                </span>

                                <input [type]="showPassword ? 'text' : 'password'" class="form-control"
                                    formControlName="password" placeholder="Input your password">

                                <span class="input-group-text" style="cursor: pointer;" (click)="togglePassword()">
                                    <i class="bi" [ngClass]="showPassword ? 'bi-eye-slash' : 'bi-eye'">
                                    </i>
                                </span>
                            </div>
                            <small class="text-danger  text-left mb-4"
                                *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
                                * This Field is required
                            </small>

                            <!-- Role Dropdown (replace existing one) -->
                            <select id="roleSelect" formControlName="role" class="form-select mt-3">
                                <option value="" disabled selected>Select Role</option>
                                <option *ngFor="let cat of filteredRoles" [value]="cat.role_id">
                                    {{ cat.role_name }}
                                </option>
                            </select>

                            <small class="text-danger mt-1 d-block"
                                *ngIf="loginForm.get('role')?.invalid && loginForm.get('role')?.touched">
                                * This Field is required
                            </small>

                            <!-- Login Button -->
                            <input class="btn btn-primary w-50 login-btn mt-5" type="submit" value="Log In">
                            <!-- <button class="btn btn-primary w-50 login-btn mt-5" [disabled]="loginForm.invalid">
                            <i class="fa-solid fa-sign-in-alt"></i> LOG IN
                        </button> -->
                        </form><br>
                        <!-- <p class="my-2">Don't have an account? <a href="#">Create Account</a></p> -->

                    </div>
                </div>

            </div>
        </div>
    </div>
</body>
