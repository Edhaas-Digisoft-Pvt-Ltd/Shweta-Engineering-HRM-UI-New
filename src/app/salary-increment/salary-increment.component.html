<div class="right-panel">
  <div class="loader-overlay" *ngIf="isLoading">
    <app-loader></app-loader>
  </div>
  <div class="main-content" [class.loading]="isLoading">
    <div class="container-fluid mt-3">

      <div class="row gx-3 align-items-center mb-3">
        <div class="col-12">
          <h2 class="fw-bold"><i class="bi bi-cash-coin me-2"></i>Salary Increment</h2>
        </div>
      </div>

      <div class="row justify-content-end gx-2 mb-3">
        <div class="col-md-3">
          <label>Search</label>
          <input class="form-control" type="text" placeholder="Search Here"
            [(ngModel)]="searchValue" (ngModelChange)="onSearchChange()" />
        </div>

        <div class="col-md-3">
          <label>Select Company</label>
          <div class="custom-select-dropdown w-100" (clickOutside)="closeCompanyDropdown()">
            <button type="button" class="btn btn-outline-secondary dropdown-toggle-btn w-100"
              (click)="toggleCompanyDropdown()">
              <span class="text-truncate">{{ companyDropdownLabel }}</span>
              <i class="bi bi-chevron-down ms-2"></i>
            </button>

            <div class="dropdown-menu" [class.show]="companyDropdownOpen">
              <div class="form-check dropdown-divider-item">
                <input class="form-check-input" type="checkbox" id="company-all" [checked]="isAllSelected()"
                  (change)="toggleAll($event)">
                <label class="form-check-label" for="company-all">All</label>
              </div>

              <div class="form-check" *ngFor="let item of CompanyNames">
                <input class="form-check-input" type="checkbox" [id]="'company-' + item.company_id"
                  [checked]="isCompanySelected(item.company_id)"
                  (change)="toggleCompany(item.company_id, $event)">
                <label class="form-check-label" [for]="'company-' + item.company_id">{{ item.company_name }}</label>
              </div>
            </div>
          </div>
        </div>

        <div class="col-auto d-flex align-items-end">
          <button class="btn btn-primary exportExcelBtn" (click)="exportExcel()" title="Export">
            <i class="bi bi-file-earmark-text-fill"></i>
          </button>
        </div>
      </div>

      <div class="row">
        <div class="col-12">
          <ag-grid-angular
            class="ag-theme-alpine"
            style="width:100%;height:480px;"
            [rowData]="rowData"
            [columnDefs]="columnDefs"
            [defaultColDef]="defaultColDef"
            [gridOptions]="gridOptions"
            (gridReady)="onGridReady($event)">
          </ag-grid-angular>
        </div>
      </div>

    </div>
  </div>
</div>
