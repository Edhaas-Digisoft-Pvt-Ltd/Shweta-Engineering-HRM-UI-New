<div class="right-panel">
    <div class="loader-overlay" *ngIf="isLoading">
        <app-loader></app-loader>
    </div>
    <div class="main-content" [class.loading]="isLoading">

        <div class="company-setup mt-3 ">
            <div class="container-fluid ">
                <div class="row gx-3  align-items-end p-2 rounded-2">
                    <div class="col-md-4 d-flex">
                        <!-- <img src="assets/img/Animation - 1743094888648.gif" alt=""> -->

                        <h2> <i class="bi bi-people-fill me-2"></i> Employees</h2>
                    </div>
                </div>

                <div class="row gx-3  align-items-end p-2 rounded-2">
                    <div class="col-md-1"></div>
                    <div class="col-md-11  d-flex justify-content-end gap-2  align-items-end">
                        <div class="">
                            <input type="text" class="form-control w-auto" placeholder="Search"
                                [(ngModel)]="searchValue" (ngModelChange)="onSearchChange()" />
                        </div>
                        <div class=" text-start select-company ">
                            <label class="fw-bold">Select Company </label>
                            <br>
                            <select class="form-select" [(ngModel)]="selectedCompanyId"
                                (change)="onCompanyChange($event)">
                                <!-- <option value="" selected>Select Company</option> -->
                                <option *ngFor="let item of CompanyNames" [value]="item.company_id">
                                    {{ item.company_name }}
                                </option>
                            </select>
                        </div>
                        <!-- <div class="">
                <button class="btn importExcel"  style="background-color: #3674b5; color: white;">Import Excel
                </button>
                </div> -->
                        <div class="">
                            <input type="file" #fileInput style="display: none" (change)="onFileChange($event)"
                                accept=".xlsx, .xls" />
                            <button class="btn importExcel" style="background-color: #3674b5; color: white;"
                                (click)="downloadTemplate()"><i class="bi bi-download"></i>&nbsp;Template
                            </button>
                        </div>
                        <div class="">
                            <input type="file" #fileInput style="display: none" (change)="onFileChange($event)"
                                accept=".xlsx, .xls" />
                            <button class="btn importExcel" style="background-color: #3674b5; color: white;"
                                (click)="openImportModal()">Import
                                Employee
                            </button>
                        </div>
                        <div class="">
                            <button class="btn createEmployee" (click)="create_user()"
                                style="background-color: #3674b5; color: white;">Create
                                Employee</button>
                        </div>
                        <div class="d-flex mt-4">
                            <button class="btn exportExcelBtn btn-primary me-2" (click)="exportExcel()">
                                <i class="bi bi-file-earmark-text-fill"></i>
                            </button>
                        </div>


                        <!-- <input type="text" name="" class="form-control" placeholder="Search Employee" id=""> -->
                    </div>
                </div>

                <div class="row">
                    <div class="col-12 mt-4">
                        <ag-grid-angular style="width: 100%; height: 60vh;" class="ag-theme-alpine" [rowData]="rowData"
                            [columnDefs]="columnDefs" [defaultColDef]="defaultColDef" [gridOptions]="gridOptions"
                            [pagination]="false" (gridReady)="onGridReady($event)">
                        </ag-grid-angular>

                        <div class="d-flex align-items-center justify-content-end flex-wrap mt-3 gap-2">
                            <button class="btn btn-sm btn-primary rounded" (click)="prevPage()"
                                [disabled]="currentPage === 1">Prev</button>
                            <button class="btn btn-sm btn-primary rounded" (click)="nextPage()"
                                [disabled]="currentPage === lastPage">Next</button>

                            <ng-container *ngFor="let page of pagesToShow">
                                <span *ngIf="page !== '...'; else ellipsis" (click)="goToPage(page)"
                                    [class.current]="page === currentPage" class="page-text">
                                    <ng-container *ngIf="page === currentPage">[{{ page
                                        }}]</ng-container>
                                    <ng-container *ngIf="page !== currentPage">{{ page
                                        }}</ng-container>
                                </span>
                                <ng-template #ellipsis><span class="mx-1">...</span></ng-template>
                            </ng-container>
                        </div>
                    </div>
                </div>
                <!-- Modal -->
                <div class="modal fade" id="importEmployeeModal" tabindex="-1">
                    <div class="modal-dialog modal-lg modal-dialog-centered">
                        <div class="modal-content rounded-4">
                            <div class="modal-header text-white rounded-top-4">
                                <h5 class="modal-title" id="applyLeaveLabel">Import Excel to add employee</h5>
                                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                                    aria-label="Close"></button>
                            </div>

                            <form>
                                <div class="modal-body">
                                    <div class="row mb-3 align-items-end">
                                        <div class="col-md-6">
                                            <label class="form-label">Select Company</label>
                                            <select class="form-select" [(ngModel)]="importExcelCompanyId"
                                                name="company">
                                                <option value="" disabled selected>-- Select Company --</option>
                                                <option *ngFor="let item of CompanyNames" [value]="item.company_id">
                                                    {{ item.company_name }}
                                                </option>
                                            </select>
                                        </div>
                                        <div class="col-md-6 d-flex align-items-end">
                                            <div>
                                                <input type="file" #fileInput style="display: none"
                                                    (change)="onFileChange($event)" accept=".xlsx, .xls" />
                                                <button type="button" class="btn importExcel"
                                                    style="background-color: #3674b5; color: white;"
                                                    (click)="fileInput.click()">
                                                    Import Excel
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>

<!-- Change Password Modal -->
<div class="modal fade" id="changePasswordModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-md">
        <div class="modal-content">

            <!-- Header -->
            <div class="modal-header">
                <h5 class="modal-title">Change Password</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <!-- Body -->
            <div class="modal-body">
                <form [formGroup]="changePasswordForm">

                    <!-- Row -->
                    <div class="row mb-3">

                        <!-- New Password -->
                        <div class="col-md-12 mb-2">
                            <label>New Password</label>

                            <div class="position-relative">
                                <input [type]="showPassword ? 'text' : 'password'" class="form-control pe-5"
                                    formControlName="password" placeholder="Enter new password">

                                <i class="bi" [ngClass]="showPassword ? 'bi-eye-slash' : 'bi-eye'"
                                    (click)="showPassword = !showPassword">
                                </i>
                            </div>

                            <small class="text-danger" *ngIf="submitted && f['password'].errors">
                                <span *ngIf="f['password'].errors?.['required']">Password is required</span>
                                <span *ngIf="f['password'].errors?.['minlength']">Minimum 6 characters required</span>
                                <span *ngIf="f['password'].errors?.['pattern']">
                                    Must include uppercase, lowercase, number & special character
                                </span>
                            </small>
                        </div>

                        <!-- Confirm Password -->
                        <div class="col-md-12 mt-2">
                            <label>Confirm Password</label>

                            <div class="position-relative">
                                <input [type]="showConfirmPassword ? 'text' : 'password'" class="form-control pe-5"
                                    formControlName="confirm_password" placeholder="Confirm password">

                                <i class="bi" [ngClass]="showConfirmPassword ? 'bi-eye-slash' : 'bi-eye'"
                                    (click)="showConfirmPassword = !showConfirmPassword">
                                </i>
                            </div>

                            <small class="text-danger" *ngIf="submitted && f['confirm_password'].errors">
                                <span *ngIf="f['confirm_password'].errors?.['required']">
                                    Confirm password is required
                                </span>
                            </small>

                            <small class="text-danger" *ngIf="submitted && changePasswordForm.errors?.['mismatch']">
                                Passwords do not match
                            </small>
                        </div>

                    </div>

                </form>
            </div>

            <!-- Footer -->
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                    Cancel
                </button>

                <button type="button" class="btn btn-primary" (click)="changePassword()">
                    Update Password
                </button>
            </div>

        </div>
    </div>
</div>
