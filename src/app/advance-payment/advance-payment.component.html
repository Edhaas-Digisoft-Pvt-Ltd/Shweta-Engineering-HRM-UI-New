<div class="right-panel">
  <div class="loader-overlay" *ngIf="isLoading">
    <app-loader></app-loader>
  </div>
  <div class="main-content" [class.loading]="isLoading">

    <div class="main-content">
      <div class="row gx-3  align-items-center p-2 rounded-2 mt-3">
        <div class="col-12 d-flex">
          <h2 class="fw-bold"> <i class="bi bi-currency-rupee me-2"></i> Advance Salary</h2>
        </div>
      </div>
      <div class="tabs-container m-2">
        <ul class="nav nav-tabs">
          <li class="nav-item" (click)="selectTab('tab1')">
            <a class="nav-link fw-bold" [ngClass]="{'active': activeTab === 'tab1'}">Requests</a>
          </li>
          <li class="nav-item" (click)="selectTab('tab2')">
            <a class="nav-link fw-bold" [ngClass]="{'active': activeTab === 'tab2'}">Approved</a>
          </li>
          <li class="nav-item" (click)="selectTab('tab3')">
            <a class="nav-link fw-bold" [ngClass]="{'active': activeTab === 'tab3'}">Details</a>
          </li>
          <li class="nav-item" (click)="selectTab('tab4')">
            <a class="nav-link fw-bold" [ngClass]="{'active': activeTab === 'tab4'}">Report</a>
          </li>
        </ul>
        <div class="tab-content mt-3">
          <div *ngIf="activeTab === 'tab1'">
            <div class="row gx-3  align-items-center  p-2 rounded-2">
              <div class="col-12  mt-2">
                <div class="row justify-content-end">
                  <div class="col-3">
                    <label>Select Company</label>
                    <div class="custom-select-dropdown w-100">
                      <button type="button" class="btn btn-outline-secondary dropdown-toggle-btn"
                        (click)="toggleCompanyDropdown()">
                        <span class="text-truncate">{{ companyDropdownLabel }}</span>
                        <i class="bi bi-chevron-down ms-2"></i>
                      </button>

                      <div class="dropdown-menu" [class.show]="companyDropdownOpen">
                        <div class="form-check dropdown-divider-item">
                          <input class="form-check-input" type="checkbox" id="company-all-advpay"
                            [checked]="isAllSelected()" (change)="toggleAll($event)">
                          <label class="form-check-label" for="company-all-advpay">All</label>
                        </div>

                        <div class="form-check" *ngFor="let item of CompanyNames">
                          <input class="form-check-input" type="checkbox" [id]="'company-advpay-' + item.company_id"
                            [checked]="isCompanySelected(item.company_id)"
                            (change)="toggleCompany(item.company_id, $event)">
                          <label class="form-check-label" [for]="'company-advpay-' + item.company_id">{{
                            item.company_name }}</label>
                        </div>
                      </div>
                    </div>
                  </div>

                  <div class="col-auto">
                    <label class="form-label mb-1">From Date</label>
                    <input class="form-control" type="date" [(ngModel)]="startDate" (change)="onDateRangeChange()" />
                  </div>

                  <div class="col-auto">
                    <label class="form-label mb-1">To Date</label>
                    <input class="form-control" type="date" [(ngModel)]="endDate" (change)="onDateRangeChange()" />
                  </div>

                  <div class="col-auto d-flex align-items-end">
                    <button class="btn btn-primary exportExcelBtn me-2" (click)="exportExcel()">
                      <i class="bi bi-file-earmark-text-fill"></i>
                    </button>
                  </div>

                </div>
              </div>
            </div>

            <div class="row gap-4 row-wrap my-3 ">
              <div class="container  ">

                <div class="row g-3">
                  <div class="col-12">
                    <ag-grid-angular class="ag-theme-alpine" [rowData]="rowData" [domLayout]="'autoHeight'"
                      [columnDefs]="columnDefs" [gridOptions]="gridOptions" [pagination]="false"
                      [defaultColDef]="defaultColDef" (gridReady)="onGridReady($event)">
                    </ag-grid-angular>

                    <div class="d-flex align-items-center justify-content-end flex-wrap mt-3 gap-2">
                      <button class="btn btn-sm btn-primary rounded" (click)="prevPage()"
                        [disabled]="currentPage === 1">
                        Prev
                      </button>
                      <button class="btn btn-sm btn-primary rounded" (click)="nextPage()"
                        [disabled]="currentPage === lastPage">
                        Next
                      </button>

                      <ng-container *ngFor="let page of pagesToShow">
                        <span *ngIf="page !== '...'; else ellipsis" (click)="goToPage(page)"
                          [class.current]="page === currentPage" class="page-text">
                          <ng-container *ngIf="page === currentPage">[{{ page }}]</ng-container>
                          <ng-container *ngIf="page !== currentPage">{{ page }}</ng-container>
                        </span>

                        <ng-template #ellipsis>
                          <span class="mx-1">...</span>
                        </ng-template>
                      </ng-container>

                    </div>

                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>


      </div>
    </div>

    <div *ngIf="activeTab === 'tab2'">
      <div class="container ">
        <app-approved-advance-payment></app-approved-advance-payment>
      </div>
    </div>

    <div *ngIf="activeTab === 'tab3'">
      <div class="container ">
        <app-advance-salary-report></app-advance-salary-report>
      </div>
    </div>

    <div *ngIf="activeTab === 'tab4'">
      <div class="container ">
        <app-advance-salary-allemp-report></app-advance-salary-allemp-report>
      </div>
    </div>

    <div class="modal fade" id="advanceRequestModal" tabindex="-1" aria-labelledby="advanceRequestModalLabel"
      aria-hidden="true">
      <div class="modal-dialog modal-xl modal-dialog-centered">
        <div class="modal-content ">
          <!-- Header -->
          <div class="modal-header text-white">
            <h5 class="modal-title" id="advanceSalaryModalLabel">Advance Salary Request Info</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <form [formGroup]="EditAdvancePayment">
            <div class="modal-body p-4">
              <div class="row mb-3">
                <div class="col-md-2">
                  <strong>ID</strong>
                  <input class="form-control" formControlName="id" value="#0001" />
                </div>
                <div class="col-md-4">
                  <strong>Employee Name</strong>
                  <input class="form-control" formControlName="employeeName" />
                </div>
                <div class="col-md-3">
                  <strong>Company</strong>
                  <input class="form-control" formControlName="company" />
                </div>
                <div class="col-md-3">
                  <strong>Department</strong>
                  <input class="form-control" formControlName="department" />
                </div>

              </div>

              <div class="row mb-4">
                <div class="col-md-2">
                  <strong>Role</strong>
                  <input class="form-control" formControlName="role" />
                </div>
                <div class="col-md-2">
                  <strong>Request Date</strong>
                  <input class="form-control" formControlName="requestData" />
                </div>
                <div class="col-md-2">
                  <strong>Status</strong>
                  <input type="text" id="status" class="form-control " formControlName="status" [ngClass]="{
                  'custom-bg-warning': EditAdvancePaymentData?.status === 'pending',
                  'custom-bg-success': EditAdvancePaymentData?.status === 'Approved',
                  'custom-bg-danger': EditAdvancePaymentData?.status === 'Rejected'
              }" [value]="EditAdvancePaymentData?.status" />
                  <!-- <div class="px-3 py-2 rounded text-center fw-bold" style="background-color: #fef3c7; color: #7c6000;">
                Pending
              </div> -->
                </div>
                <div class="col-md-2">
                  <strong>Tenure</strong>
                  <input class="form-control" formControlName="tenure" />
                </div>
                <div class="col-md-2"><strong>Amount (in ₹)</strong><input class="form-control" value="10,000"
                    formControlName="amount" /></div>

              </div>

              <div class="row mb-4">
                <!-- <div class="col-md-3"><strong>EMI Start Date</strong><input class="form-control"
                    formControlName="EMIStartDate" readonly /></div> -->
                <div class="col-md-4">
                  <strong>Reason <small class="text-muted">(In Case of Rejection)</small></strong>
                  <textarea class="form-control" formControlName="reason" rows="3" readonly></textarea>
                </div>
                <div class="col-md-3"><strong>Installment Amount (in ₹)</strong><input class="form-control bg-light"
                    formControlName="installmentAmount" readonly /></div>
              </div>
            </div>
          </form>

          <div class="modal-footer"
            *ngIf="!(EditAdvancePaymentData?.status === 'Approved' || EditAdvancePaymentData?.status === 'Rejected')">
            <button type="button" class="btn approveBtn" (click)="updateStatus('Approved')">Approve
              Request</button>
            <button type="button" class="btn declineBtn" (click)="updateStatus('Rejected')">Decline
              Request</button>
            <button type="button" class="btn btn-outline-dark fw-semobild " data-bs-dismiss="modal">Cancel</button>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>

<!-- Salary Tracker Modal -->
<div class="modal fade" id="advanceSalaryTrackerModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">Salary Tracker</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">

        <form [formGroup]="salaryTrackerForm">

          <div class="row">

            <div class="col-md-4 mb-3">
              <label>Employee Name</label>
              <input type="text" class="form-control" formControlName="emp_name" readonly>
            </div>

            <div class="col-md-4 mb-3">
              <label>Advance Amount</label>
              <input type="text" class="form-control" formControlName="amount" readonly>
            </div>

            <div class="col-md-4 mb-3">
              <label>Tenure</label>
              <input type="text" class="form-control" formControlName="tenure" readonly>
            </div>

          </div>

          <div class="row">

            <div class="col-md-6 mb-3">
              <label>Payment Mode <span class="text-danger">*</span></label>
              <select class="form-control" formControlName="payment_mode"
                [ngClass]="{'is-invalid': isSubmitted && salaryTrackerForm.get('payment_mode')?.invalid}">
                <option value="">-- Select Payment Mode --</option>
                <option value="Cash">Cash</option>
                <option value="Bank Transfer">Bank Transfer</option>
                <option value="UPI">UPI</option>
                <option value="Cheque">Cheque</option>
              </select>
            </div>

            <div class="col-md-6 mb-3">
              <label>Transfer Data <span class="text-danger">*</span></label>
              <input type="text" class="form-control" placeholder="Enter reference / UTR / Cheque No."
                formControlName="transfer_data"
                [ngClass]="{'is-invalid': isSubmitted && salaryTrackerForm.get('transfer_data')?.invalid}">
            </div>

          </div>

        </form>

      </div>

      <div class="modal-footer">
        <button *ngIf="!hideSubmitButton" class="btn text-white exportExcelBtn"
          (click)="accountantConfiramationAdvSalary()">Submit</button>
      </div>

    </div>
  </div>
</div>
