<div class="right-panel">
    <div class="loader-overlay" *ngIf="isLoading">
        <app-loader></app-loader>
    </div>
    <div class="main-content" [class.loading]="isLoading">

        <div class="d-flex flex-wrap align-items-end justify-content-end gap-3 mb-3 rounded-2">
            <input type="text" class="form-control w-auto" style="min-width: 200px;"
                placeholder="Search" [(ngModel)]="searchValue"
                (ngModelChange)="onSearchChange()" />

            <div>
                <label class="form-label mb-1">Select Company</label>
                <select class="form-select" style="min-width: 180px;" [(ngModel)]="selectedCompanyId"
                    (change)="onCompanyChange($event)">
                    <option *ngFor="let item of CompanyNames" [value]="item.company_id">{{ item.company_name }}</option>
                </select>
            </div>

            <div>
                <label class="form-label mb-1">Select Year</label>
                <select class="form-select" style="min-width: 120px;" [(ngModel)]="selectedYear"
                    (change)="onYearMonthChange()">
                    <option *ngFor="let year of financialYears">{{ year }}</option>
                </select>
            </div>

            <button class="btn btn-primary BtnColor d-flex align-items-center" (click)="exportExcel()">
                <i class="bi bi-file-earmark-text-fill"></i>
            </button>
        </div>


        <div class="row gap-4 row-wrap my-3 ">
            <div class="container  ">

                <div class="row g-3">
                    <div class="col-12">
                        <ag-grid-angular class="ag-theme-alpine" [rowData]="rowData" [gridOptions]="gridOptions"
                            [domLayout]="'autoHeight'" [pagination]="false" [columnDefs]="columnDefs"
                            [defaultColDef]="defaultColDef" (gridReady)="onGridReady($event)">
                        </ag-grid-angular>

                        <div class="d-flex align-items-center justify-content-end flex-wrap mt-3 gap-2">
                            <button class="btn btn-sm btn-primary rounded" (click)="prevPage()"
                                [disabled]="currentPage === 1">Prev</button>
                            <button class="btn btn-sm btn-primary rounded" (click)="nextPage()"
                                [disabled]="currentPage === lastPage">Next</button>

                            <ng-container *ngFor="let page of pagesToShow">
                                <span *ngIf="page !== '...'; else ellipsis" (click)="goToPage(page)"
                                    [class.current]="page === currentPage" class="page-text">
                                    <ng-container *ngIf="page === currentPage">[{{ page
                                        }}]</ng-container>
                                    <ng-container *ngIf="page !== currentPage">{{ page
                                        }}</ng-container>
                                </span>
                                <ng-template #ellipsis><span class="mx-1">...</span></ng-template>
                            </ng-container>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>
