<div class="right-panel">
    <div class="loader-overlay" *ngIf="isLoading">
        <app-loader></app-loader>
    </div>
    <div class="main-content" [class.loading]="isLoading">

        <div class="d-flex flex-wrap align-items-end justify-content-end gap-3 mb-3 rounded-2">
            <input type="text" class="form-control w-auto" style="min-width: 200px;" placeholder="Search"
                [(ngModel)]="searchValue" (ngModelChange)="onSearchChange()" />

            <div>
                <label class="form-label mb-1">Select Company</label>
                <select class="form-select" style="min-width: 180px;" [(ngModel)]="selectedCompanyId"
                    (change)="onCompanyChange($event)">
                    <option value="all">All</option>
                    <option *ngFor="let item of CompanyNames" [value]="item.company_id">{{ item.company_name }}</option>
                </select>
            </div>

            <div>
                <label class="form-label mb-1">Select Year</label>
                <select class="form-select" [(ngModel)]="selectedYear" (change)="onYearMonthChange()">
                    <option *ngFor="let year of years" [value]="year">{{ year }}</option>
                </select>
            </div>

            <button class="btn btn-primary BtnColor d-flex align-items-center" (click)="exportExcel()">
                <i class="bi bi-file-earmark-text-fill"></i>
            </button>
        </div>


        <div class="row gap-4 row-wrap my-3 ">
            <div class="container  ">

                <div class="row g-3">
                    <div class="col-12">
                        <ag-grid-angular class="ag-theme-alpine" [rowData]="rowData" [gridOptions]="gridOptions"
                            [domLayout]="'autoHeight'" [pagination]="false" [columnDefs]="columnDefs"
                            [defaultColDef]="defaultColDef" (gridReady)="onGridReady($event)">
                        </ag-grid-angular>

                        <div class="d-flex align-items-center justify-content-end flex-wrap mt-3 gap-2">
                            <button class="btn btn-sm btn-primary rounded" (click)="prevPage()"
                                [disabled]="currentPage === 1">Prev</button>
                            <button class="btn btn-sm btn-primary rounded" (click)="nextPage()"
                                [disabled]="currentPage === lastPage">Next</button>

                            <ng-container *ngFor="let page of pagesToShow">
                                <span *ngIf="page !== '...'; else ellipsis" (click)="goToPage(page)"
                                    [class.current]="page === currentPage" class="page-text">
                                    <ng-container *ngIf="page === currentPage">[{{ page
                                        }}]</ng-container>
                                    <ng-container *ngIf="page !== currentPage">{{ page
                                        }}</ng-container>
                                </span>
                                <ng-template #ellipsis><span class="mx-1">...</span></ng-template>
                            </ng-container>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="modal fade" id="advanceSalaryModalinfo" tabindex="-1" aria-labelledby="advanceSalaryModalLabel"
            aria-hidden="true">
            <div class="modal-dialog modal-xl modal-dialog-centered">
                <div class="modal-content">

                    <div class="modal-header  text-white">
                        <h5 class="modal-title" id="advanceSalaryModalLabel">Advance Salary Report</h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                            aria-label="Close"></button>
                    </div>

                    <form [formGroup]="displayApprovedData">
                        <div class="modal-body p-4">

                            <div class="row mb-3">
                                <div class="col-md-3"><strong>ID</strong><input class="form-control"
                                        formControlName="id" value="id">
                                </div>
                                <div class="col-md-5"><strong>Employee Name</strong><input class="form-control"
                                        formControlName="employeeName"></div>
                                <div class="col-md-4"><strong>Company</strong><input class="form-control"
                                        formControlName="company">
                                </div>
                            </div>

                            <div class="row mb-3">
                                <div class="col-md-3"><strong>Department</strong><input class="form-control"
                                        formControlName="department"></div>
                                <div class="col-md-3"><strong>Role</strong><input class="form-control"
                                        formControlName="role"></div>
                                <div class="col-md-3"><strong>Tenure</strong><input class="form-control"
                                        formControlName="tenure"></div>
                                <div class="col-md-3"><strong>Amount (in ₹)</strong><input class="form-control"
                                        formControlName="amount"></div>
                                <!-- <div class="col-md-2"><strong>status</strong><input class="form-control"
                                        formControlName="emi_status"></div> -->
                            </div>

                        </div>

                        <div class="row mb-3">
                            <div class="col-12 ps-5 pe-5">
                                <div class="table-responsive" style="border: 1px solid #ccc;">
                                    <table class="table table-hover text-center align-middle">
                                        <thead class="sticky-top" style="top: 0; z-index: 1;">
                                            <tr>
                                                <th>Sr. no.</th>
                                                <th>Installment Date</th>
                                                <th>Amount</th>
                                                <th>EMI Status</th>
                                                <th>Remarks</th>
                                            </tr>
                                        </thead>
                                        <tbody *ngIf="selectedAdvpayid && tabledata[selectedAdvpayid]">
                                            <tr *ngFor="let item of tabledata[selectedAdvpayid]; let i = index">
                                                <td>{{ i + 1 }}</td>
                                                <td>{{ item.date }}</td>
                                                <td>{{ item.installment_amount }}</td>
                                                <td>{{ item.installment_status }}</td>
                                                <td>{{ item.remarks }}</td>

                                                <ng-template #mergedRow>
                                                    <td colspan="4" class="text-center fw-bold">{{ item.status }}</td>
                                                </ng-template>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>

                    </form>
                </div>
            </div>
        </div>

    </div>
</div>
