<div class="right-panel">

    <div class="row gx-3 align-items-center rounded-2">
        <div class="col-12">
            <div class="row justify-content-end align-items-end">

                <!-- <div class="col-3">
                    <label class="mb-1 fw-semibold">Select Company</label>
                    <select class="form-select" (change)="onCompanyChange($event)">
                        <option *ngFor="let item of CompanyNames" [value]="item.company_id">
                            {{ item.company_name }}
                        </option>
                    </select>
                </div> -->

                <div class="col-auto">
                    <button type="button" class="btn text-white mb-1 px-4 BtnColor" data-bs-toggle="modal"
                        data-bs-target="#addBonusIncentive">
                        Add Bonus
                    </button>
                </div>

            </div>
        </div>
    </div>

    <div class="row mt-3">
        <div class="col-12">
            <ag-grid-angular class="ag-theme-alpine" style="width: 100%; height: 60vh;" [rowData]="rowData"
                [columnDefs]="columnDefs" [pagination]="true" [defaultColDef]="defaultColDef">
            </ag-grid-angular>
        </div>
    </div>

    <!-- Modal Content -->
    <div class="modal fade modal-xl text-left" id="addBonusIncentive" tabindex="-1" aria-labelledby="exampleModalLabel"
        aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="exampleModalLabel">Add Bonus</h5>
                    <button type="button text-white" class="btn-close" data-bs-dismiss="modal"
                        aria-label="Close"></button>
                </div>
                <div class="modal-body text-left">
                    <form [formGroup]="addBonusForm" (ngSubmit)="addBonusData()">
                        <div class="row">

                            <div class="col-md-3 text-start select-company">
                                <label class="fw-bold" disabled selected>Select Company<span
                                        class="text-danger">*</span></label>
                                <select class="form-select" formControlName="companyid">
                                    <option [value]="null" disabled>Select Company</option>
                                    <option *ngFor="let item of CompanyNames" [value]="item.company_id">
                                        {{ item.company_name }}
                                    </option>
                                </select>

                            </div>

                            <div class="col-md-3">
                                <label class="form-label">From Date<span class="text-danger">*</span></label>
                                <input type="date" class="form-control" formControlName="from_date" />

                            </div>

                            <div class="col-md-3">
                                <label class="form-label">To Date<span class="text-danger">*</span></label>
                                <input type="date" class="form-control" formControlName="to_date" />
                            </div>

                            <div class="col-md-3">
                                <label class="form-label">Rate</label>
                                <input type="number" class="form-control" formControlName="rate"
                                    placeholder="Enter Rate" />
                            </div>

                        </div>

                        <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                            <button type="submit" class="btn BtnColor mt-3 ml-auto btn-end submit-btn">Submit</button>
                        </div>
                    </form>


                </div>
            </div>
        </div>
    </div>

</div>
