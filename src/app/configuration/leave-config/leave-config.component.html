<div class="right-panel">
    <div class="loader-overlay" *ngIf="isLoading">
        <app-loader></app-loader>
    </div>
    <div class="main-content" [class.loading]="isLoading">

        <div class="row gx-3 align-items-center rounded-2">
            <div class="col-12">
                <div class="row justify-content-end align-items-end">

                    <div class="col-3">
                        <label class="mb-1 fw-semibold">Select Company</label>
                        <select class="form-select" (change)="onCompanyChange($event)">
                            <option *ngFor="let item of CompanyNames" [value]="item.company_id">
                                {{ item.company_name }}
                            </option>
                        </select>
                    </div>

                    <div class="col-auto">
                        <button type="button" class="btn text-white mb-1 px-4 BtnColor" (click)="openModal()">
                            Add New
                        </button>
                    </div>

                </div>
            </div>
        </div>

        <div class="row mt-3">
            <div class="col-12">
                <ag-grid-angular class="ag-theme-alpine" style="width: 100%; height: 60vh;" [rowData]="rowData"
                    [columnDefs]="columnDefs" [pagination]="true" [defaultColDef]="defaultColDef"
                    (gridReady)="onGridReady($event)">
                </ag-grid-angular>
            </div>
        </div>

        <!-- Modal Content -->
        <div class="modal fade modal-xl text-left" id="addLeaveModal" tabindex="-1" aria-labelledby="exampleModalLabel"
            aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="exampleModalLabel">Add New Leave Configuration</h5>
                        <button type="button text-white" class="btn-close" data-bs-dismiss="modal"
                            aria-label="Close"></button>
                    </div>
                    <div class="modal-body text-left">
                        <form [formGroup]="LeaveRule" (ngSubmit)="addLeaveRule()">
                            <div class="row">

                                <!-- Company -->
                                <div class="col-md-3 text-start select-company">
                                    <label class="fw-bold" disabled selected>Select Company<span
                                            class="text-danger">*</span></label>
                                    <select class="form-select" formControlName="companyid" [ngClass]="{
                                'input-error': isSubmitted && LeaveRule.get('companyid')?.invalid,
                                'is-invalid': isSubmitted && LeaveRule.get('companyid')?.invalid
                            }">
                                        <option [value]="null" disabled>Select Company</option>
                                        <option *ngFor="let item of CompanyNames" [value]="item.company_id">
                                            {{ item.company_name }}
                                        </option>
                                    </select>
                                    <small class="text-danger"
                                        *ngIf="isSubmitted && LeaveRule.get('companyid')?.invalid">
                                        Please select a valid company.
                                    </small>
                                </div>

                                <!-- Leave Type -->
                                <div class="col-md-3">
                                    <label for="leavetype">Leave Type<span class="text-danger">*</span></label>
                                    <select id="leavetype" class="form-select" formControlName="leavetype" [ngClass]="{
          'input-error': isSubmitted && LeaveRule.get('leavetype')?.invalid,
          'is-invalid': isSubmitted && LeaveRule.get('leavetype')?.invalid
        }">
                                        <option [value]="null" disabled selected>Select Leave Type</option>
                                        <option value="Every Month">Every Month</option>
                                        <option value="Every Year">Every Year</option>
                                    </select>
                                    <small class="text-danger"
                                        *ngIf="isSubmitted && LeaveRule.get('leavetype')?.invalid && LeaveRule.get('leavetype')?.value">
                                        Please select a valid leave type.
                                    </small>
                                </div>

                                <!-- Leave Name -->
                                <div class="col-md-3">
                                    <label for="leavename">Leave Name<span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" id="leavename" formControlName="leavename"
                                        placeholder="Please Enter Leave Name" [ngClass]="{
          'input-error': isSubmitted && LeaveRule.get('leavename')?.invalid,
          'is-invalid': isSubmitted && LeaveRule.get('leavename')?.invalid
        }" (keypress)="allowOnlyLetters($event)">
                                    <small class="text-danger"
                                        *ngIf="isSubmitted && LeaveRule.get('leavename')?.invalid && LeaveRule.get('leavename')?.value">
                                        Please enter a valid leave name.
                                    </small>
                                </div>

                                <!-- No. Of Leaves -->
                                <div class="col-md-3">
                                    <label for="leavenumber">No. of leaves<span class="text-danger">*</span></label>
                                    <input type="number" class="form-control" id="leavenumber"
                                        formControlName="leavenumber" placeholder="Please Enter Leave number" [ngClass]="{
                            'input-error': isSubmitted && LeaveRule.get('leavenumber')?.invalid,
                            'is-invalid': isSubmitted && LeaveRule.get('leavenumber')?.invalid
                            }">
                            <small class="text-danger" *ngIf="LeaveRule.get('leavenumber')?.errors?.['min']">
                                Number of leaves never less than 0.
                            </small>
                            <small class="text-danger" *ngIf="LeaveRule.get('leavenumber')?.errors?.['max']">
                                Number of leaves cannot exceed 31.
                            </small>
                                </div>

                            </div>

                            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                                <button type="submit"
                                    class="btn BtnColor mt-3 ml-auto btn-end submit-btn">Submit</button>
                            </div>
                        </form>


                    </div>
                </div>
            </div>
        </div>


        <!-- Modal Content for edit -->
        <!-- Modal -->
        <div class="modal fade modal-lg" id="exampleModal2" tabindex="-1" aria-labelledby="exampleModalLabel">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="exampleModalLabel">Edit Leave Configuration</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <form [formGroup]="EditLeaveRule" (ngSubmit)="editLeaveData()">
                            <div class="row">
                                <!-- Leave Type -->
                                <div class="col-4">
                                    <label for="leavetype">Leave Type<span class="text-danger">*</span></label>
                                    <select id="leavetype" class="form-select" formControlName="leavetype"
                                        [ngClass]="{'input-error': isEditSubmitted && EditLeaveRule.get('leavetype')?.invalid}">
                                        <option>Every Month</option>
                                        <option>Every Year</option>
                                    </select>
                                </div>

                                <!-- Leave Name -->
                                <div class="col-4">
                                    <label for="leavename">Leave Name<span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" id="leavename" formControlName="leavename"
                                        placeholder="Please Enter Leave Name" [ngClass]="{
                                        'input-error': isEditSubmitted && EditLeaveRule.get('leavename')?.invalid,
                                        'is-invalid': isEditSubmitted && EditLeaveRule.get('leavename')?.invalid
                                    }">
                                </div>

                                <!-- No. Of Leaves -->
                                <div class="col-4">
                                    <label for="leavenumber">No. of leaves<span class="text-danger">*</span></label>
                                    <input type="number" class="form-control" id="leavenumber"
                                        formControlName="leavenumber" placeholder="Please Enter Leave number"
                                        [ngClass]="{'input-error': isEditSubmitted && EditLeaveRule.get('leavenumber')?.invalid}">
                                    <small class="text-danger" *ngIf="EditLeaveRule.get('leavenumber')?.errors?.['min']">
                                        Number of leaves never less than 0.
                                    </small>
                                    <small class="text-danger" *ngIf="EditLeaveRule.get('leavenumber')?.errors?.['max']">
                                        Number of leaves cannot exceed 31.
                                    </small>
                                </div>
                            </div>

                            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                                <button type="submit" class="btn BtnColor mt-3 ml-auto btn-end">Update</button>
                            </div>
                        </form>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>
